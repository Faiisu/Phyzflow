[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-sdk"
version = "3.1.0"
requires-python = ">=3.12"
dependencies = ["pywin32>=306; sys_platform == 'win32'"]
description = "Run and debug Python inference flows."

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
workspace = "workspace_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workspace_sdk = ["static/*", "static/flow-view/*.js", "static/workspace/*.js"]
