[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-sdk"
version = "0.1.0"
requires-python = ">=3.12"
description = "Run and debug Python inference flows."

[project.scripts]
workspace = "workspace_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workspace_sdk = ["static/*"]
