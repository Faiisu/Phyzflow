<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace | Flow sheets</title>
  <link rel="stylesheet" href="/workspace.css">
  <script type="module" src="/workspace.js"></script>
</head>
<body>
  <main id="sheets" aria-label="Flow sheets">
    <div id="notice" class="notice">
      <p id="notice-message" role="status">Loading flows…</p>
      <button type="button" id="open-flow" hidden>Open flow</button>
    </div>
  </main>
  <footer class="sheet-bar">
    <span id="workspace-name" class="workspace-name">Workspace</span>
    <div id="sheet-tabs" class="sheet-tabs" role="tablist" aria-label="Flows"></div>
  </footer>
</body>
</html>
