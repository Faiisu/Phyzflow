<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phyzflow | Flow sheets</title>
  <link rel="stylesheet" href="./workspace.css">
  <script type="module" src="./workspace.js"></script>
</head>
<body class="workspace-page">
  <header class="workspace-header">
    <div class="workspace-heading">
      <a id="workspace-home" aria-hidden="true">
        <span class="workspace-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      </a>
      <h1 id="workspace-name" class="workspace-name">Workspace</h1>
    </div>
    <div class="workspace-actions" role="group" aria-label="Workspace actions">
      <button type="button" id="open-workspace-dashboard" class="secondary-action" aria-haspopup="dialog">Dashboard</button>
      <button type="button" id="open-workspace-files" class="secondary-action" aria-haspopup="dialog">Files</button>
      <button type="button" id="run-all" class="secondary-action" hidden>Run All</button>
      <button type="button" id="rename-sheet" class="secondary-action" aria-haspopup="dialog" disabled>Rename sheet</button>
      <button type="button" id="edit-flow-source" class="secondary-action" aria-haspopup="dialog" disabled>Edit flow.py</button>
      <button type="button" id="reload-flow" class="secondary-action" disabled>Reload flow</button>
    </div>
    <div class="workspace-run">
      <span id="workspace-flow-status" class="workspace-flow-status" role="status" hidden></span>
      <button type="button" id="run-sheet" disabled><span class="play-mark" aria-hidden="true"></span>Run flow</button>
    </div>
    <div class="workspace-feedback">
      <p id="format-notice" role="status" hidden></p>
      <p id="reload-message" role="status" hidden></p>
      <p id="edit-lock-message" aria-live="polite" hidden></p>
      <button type="button" id="force-open-flow" hidden>Force Open</button>
    </div>
  </header>
  <main id="sheets" aria-label="Flow sheets">
    <div id="notice" class="notice">
      <p id="recovery-hint" hidden></p>
      <p id="notice-message" role="status">Loading flows…</p>
      <button type="button" id="open-flow" hidden>Open flow</button>
    </div>
  </main>
  <footer class="sheet-bar">
    <div id="sheet-tabs" class="sheet-tabs" role="tablist" aria-label="Flows"></div>
    <button type="button" id="new-sheet" aria-label="New sheet" title="New sheet" disabled>+</button>
  </footer>
  <dialog id="workspace-dashboard" aria-label="Workspace dashboard">
    <iframe title="Workspace Dashboard" allowfullscreen></iframe>
  </dialog>
  <dialog id="workspace-files" class="sheet-dialog" aria-labelledby="workspace-files-title">
    <header class="workspace-files-header">
      <h2 id="workspace-files-title">Workspace files</h2>
      <button type="button" id="close-workspace-files" class="secondary-action" autofocus>Close</button>
    </header>
    <div class="workspace-files-location">
      <button type="button" id="workspace-files-up" class="secondary-action" disabled>Up</button>
      <code id="workspace-files-path" aria-live="polite" tabindex="-1">Files</code>
    </div>
    <div id="workspace-files-drop" role="region" aria-label="Current folder">
      <ul id="workspace-files-list" aria-label="Folder contents"></ul>
      <p id="workspace-files-empty" hidden>This folder is empty.</p>
      <div class="workspace-files-drop-hint">
        <p>Drop files here or on a folder</p>
        <button type="button" id="choose-workspace-files" class="secondary-action" disabled>Choose files</button>
        <input type="file" id="workspace-file-input" multiple hidden>
      </div>
    </div>
    <form id="workspace-folder-form">
      <label for="workspace-files-folder">New folder name</label>
      <div class="workspace-files-create">
        <input id="workspace-files-folder" required autocomplete="off">
        <button type="submit" class="secondary-action" disabled>Create folder</button>
      </div>
    </form>
    <p id="workspace-files-status" role="status"></p>
    <p id="workspace-files-error" class="dialog-error" role="alert" hidden></p>
  </dialog>
  <dialog id="flow-source" class="sheet-dialog" aria-labelledby="flow-source-title">
    <form>
      <h1 id="flow-source-title">Edit flow.py</h1>
      <textarea id="flow-source-input" aria-label="Source code" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" disabled></textarea>
      <p id="flow-source-message" role="status"></p>
      <p id="source-change-message" aria-live="polite" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="force-open-source" hidden>Force Open</button>
        <button type="button" id="close-flow-source">Close</button>
        <button type="submit" disabled>Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="create-sheet" class="sheet-dialog" aria-labelledby="create-sheet-title">
    <form>
      <h1 id="create-sheet-title">New sheet</h1>
      <label for="sheet-title">Sheet name</label>
      <input id="sheet-title" name="name" required maxlength="64" autofocus>
      <p id="create-error" class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-sheet">Cancel</button>
        <button type="submit">Create sheet</button>
      </div>
    </form>
  </dialog>
  <dialog id="delete-sheet" class="sheet-dialog" aria-labelledby="delete-sheet-title" aria-describedby="delete-sheet-message">
    <form>
      <h1 id="delete-sheet-title">Delete sheet?</h1>
      <p id="delete-sheet-message"></p>
      <p class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" autofocus>Cancel</button>
        <button type="submit">Delete sheet</button>
      </div>
    </form>
  </dialog>
  <dialog id="force-open-sheet" class="sheet-dialog" aria-labelledby="force-open-title" aria-describedby="force-open-effect">
    <form>
      <h1 id="force-open-title">Force open sheet?</h1>
      <dl class="force-open-details">
        <div><dt>Lock owner</dt><dd id="force-open-owner"></dd></div>
        <div><dt>Last heartbeat</dt><dd id="force-open-heartbeat"></dd></div>
        <div><dt>Session status</dt><dd id="force-open-status"></dd></div>
      </dl>
      <p id="force-open-effect" class="force-open-effect"></p>
      <p id="force-open-error" class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-force-open" autofocus>Cancel</button>
        <button type="submit" id="confirm-force-open">Force Open</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./workspace/dashboard.js"></script>
  <script type="module" src="./workspace/files.js"></script>
</body>
</html>
