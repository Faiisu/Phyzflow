<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phyzflow | Workspaces</title>
  <link rel="stylesheet" href="/workspace.css">
  <script type="module" src="/landing.js"></script>
  <script type="module" src="/mcp-access.js"></script>
</head>
<body class="landing">
  <main class="workspace-list">
    <header class="workspace-list-heading">
      <h1>Workspaces</h1>
      <div class="workspace-list-actions">
        <button type="button" id="new-workspace">Create Workspace</button>
        <button type="button" id="add-workspace">Add Workspace</button>
        <button type="button" id="open-mcp-access">MCP access</button>
      </div>
    </header>
    <p id="workspace-list-message" role="status">Loading Workspaces…</p>
    <p id="workspace-list-error" class="dialog-error" role="alert" hidden></p>
    <ul id="registered-workspaces" aria-label="Registered Workspaces"></ul>
  </main>
  <dialog id="create-workspace" class="sheet-dialog" aria-labelledby="create-workspace-title">
    <form>
      <h2 id="create-workspace-title">Create Workspace</h2>
      <label for="workspace-path">New folder path</label>
      <input id="workspace-path" name="path" required autofocus>
      <p id="workspace-path-hint" class="dialog-hint">Enter an absolute path on the Phyzflow host. The parent folder must already exist.</p>
      <p id="create-workspace-status" role="status"></p>
      <p id="create-workspace-error" class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-workspace">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
  </dialog>
  <dialog id="mcp-access" class="sheet-dialog" aria-labelledby="mcp-access-title">
    <form autocomplete="off">
      <h2 id="mcp-access-title">MCP access</h2>
      <label for="mcp-token-choice">Token</label>
      <select id="mcp-token-choice" name="identity"></select>
      <div id="mcp-client-details">
        <label for="mcp-client-name">Client name</label>
        <input id="mcp-client-name" name="name" maxlength="80" required>
      </div>
      <fieldset id="mcp-workspaces">
        <legend>Workspace grants</legend>
        <div id="mcp-workspace-options"></div>
      </fieldset>
      <div id="mcp-issued-token" hidden>
        <label for="mcp-secret">MCP bearer token</label>
        <input id="mcp-secret" type="text" readonly spellcheck="false" autocapitalize="off">
        <p class="dialog-hint">Copy this token now. Phyzflow only displays it once.</p>
      </div>
      <p id="mcp-access-status" role="status"></p>
      <p id="mcp-access-error" class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="close-mcp-access">Close</button>
        <button type="button" id="revoke-mcp-token" hidden>Revoke token</button>
        <button type="submit" id="save-mcp-token">Issue token</button>
      </div>
    </form>
  </dialog>
</body>
</html>
