<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24262b">
  <title>Workspace | Flow editor</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="stage" aria-labelledby="graph-heading">
    <h1 id="graph-heading" class="sr-only">Execution graph</h1>
    <div class="graph-scroll" role="region" aria-label="Flow dependencies" tabindex="0">
      <div id="graph-plane">
        <div id="graph"><canvas aria-hidden="true"></canvas></div>
      </div>
    </div>
  </main>

  <header id="panel-toolbar" class="overlay toolbar">
    <div class="toolbar-project">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <strong>Workspace</strong>
      <span id="project-name" class="project-name" hidden></span>
      <span class="document-name">flow.py</span>
    </div>
    <div class="toolbar-actions">
      <span id="status" role="status" class="badge">Ready</span>
      <button type="submit" form="run-form" class="primary-button" id="run-flow" disabled>
        <span class="play-mark" aria-hidden="true"></span>Run flow
      </button>
      <button type="button" class="close-panel" data-close-panel="toolbar" aria-label="Close Toolbar">×</button>
    </div>
  </header>

  <aside id="panel-outline" class="overlay outline" aria-labelledby="outline-heading">
    <div class="dock-heading">
      <h2 id="outline-heading">Flow outline</h2>
      <button type="button" class="close-panel" data-close-panel="outline" aria-label="Close Flow outline">×</button>
    </div>
    <ul id="outline-list"></ul>
  </aside>

  <aside class="overlay-stack" aria-label="Workspace tools">
    <section id="panel-inspector" class="overlay" aria-labelledby="inspector-heading">
      <div class="dock-heading">
        <h2 id="inspector-heading">Node inspector</h2>
        <button type="button" class="close-panel" data-close-panel="inspector" aria-label="Close Inspector">×</button>
      </div>
      <div class="dock-content">
        <p id="inspector-empty" class="muted">Select a node to inspect its connections.</p>
        <div id="inspector-detail" hidden>
          <div class="inspector-title">
            <strong id="inspector-name"></strong>
            <span id="inspector-state" class="badge"></span>
          </div>
          <p id="inspector-description" hidden></p>
          <div class="source-row">
            <code id="inspector-source"></code>
            <button type="button" id="copy-source" class="text-button">Copy location</button>
          </div>
          <div class="inspector-links">
            <div><h3>Inputs</h3><ul id="inspector-inputs"></ul></div>
            <div><h3>Feeds</h3><ul id="inspector-feeds"></ul></div>
          </div>
        </div>
      </div>
    </section>

    <section id="panel-run" class="overlay" aria-labelledby="run-heading" hidden>
      <div class="dock-heading">
        <h2 id="run-heading">Run</h2>
        <button type="button" class="close-panel" data-close-panel="run" aria-label="Close Run">×</button>
      </div>
      <form id="run-form" aria-labelledby="input-label">
        <div class="dock-content">
          <label id="input-label" for="input">Run input <span class="muted">JSON</span></label>
          <textarea id="input" rows="5" spellcheck="false" autocomplete="off" required></textarea>
          <div class="run-actions">
            <button type="submit" class="primary-button" id="run-input" disabled>Run with this input</button>
            <button type="button" class="text-button" id="reset-input" disabled>Reset input</button>
          </div>
        </div>
      </form>
      <section class="dock-content run-details" aria-labelledby="run-details-heading">
        <h3 id="run-details-heading">Run details</h3>
        <div id="result">
          <p class="muted">Run the flow to see its output and node diagnostics.</p>
        </div>
      </section>
    </section>

    <section id="panel-history" class="overlay" aria-labelledby="history-heading" hidden>
      <div class="dock-heading">
        <h2 id="history-heading">Run history</h2>
        <button type="button" class="close-panel" data-close-panel="history" aria-label="Close History">×</button>
      </div>
      <div id="history-list" class="dock-content"></div>
      <div class="dock-content history-actions">
        <button type="button" id="refresh-history" class="text-button">Refresh history</button>
      </div>
      <div id="history-detail" class="dock-content"></div>
    </section>
  </aside>

  <details class="panel-switcher" id="panel-switcher">
    <summary class="overlay">Panels</summary>
    <div class="overlay panel-menu" role="group" aria-label="Panel visibility">
      <button type="button" aria-controls="panel-toolbar" aria-pressed="true">Toolbar</button>
      <button type="button" aria-controls="panel-outline" aria-pressed="true">Flow outline</button>
      <button type="button" aria-controls="panel-inspector" aria-pressed="true">Inspector</button>
      <button type="button" aria-controls="panel-run" aria-pressed="false">Run</button>
      <button type="button" aria-controls="panel-history" aria-pressed="false">History</button>
      <button type="button" aria-controls="panel-zoom" aria-pressed="true">Zoom controls</button>
    </div>
  </details>

  <div id="panel-zoom" class="overlay canvas-controls">
    <span id="graph-summary"></span>
    <button type="button" id="center-graph" class="text-button" disabled>Center</button>
    <div class="zoom-controls" role="group" aria-label="Graph zoom">
      <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out" disabled>−</button>
      <button type="button" id="zoom-reset" aria-label="Reset zoom to 100%" title="Reset zoom to 100%" disabled>
        <span id="zoom-level" aria-live="polite">100%</span>
      </button>
      <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in" disabled>+</button>
    </div>
    <button type="button" class="close-panel" data-close-panel="zoom" aria-label="Close Zoom controls">×</button>
  </div>
</body>
</html>
