<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace | Flow runner</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true"></span>
    <h1>Workspace</h1>
  </header>
  <main>
    <section class="flow" aria-labelledby="flow-heading">
      <div class="section-title"><h2 id="flow-heading">Flow</h2></div>
      <div class="graph-scroll" role="region" aria-label="Flow dependencies" tabindex="0">
        <div id="graph"><canvas aria-hidden="true"></canvas></div>
      </div>
      <form>
        <label for="input">Run input <span>JSON</span></label>
        <textarea id="input" rows="5" spellcheck="false" required></textarea>
        <button type="submit" disabled>Run flow <span aria-hidden="true">→</span></button>
      </form>
    </section>
    <section class="run" aria-labelledby="run-heading">
      <div class="section-title">
        <h2 id="run-heading">Run details</h2>
        <span id="status" role="status">Ready</span>
      </div>
      <div id="result"><p>Run the flow to inspect its output or trace an error.</p></div>
    </section>
    <section class="history" aria-labelledby="history-heading">
      <div class="section-title">
        <h2 id="history-heading">Run history</h2>
        <button type="button" id="refresh-history">Refresh history</button>
      </div>
      <div class="history-grid">
        <div id="history-list"></div>
        <div id="history-detail"></div>
      </div>
    </section>
  </main>
</body>
</html>
